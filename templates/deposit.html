<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deposit Money | SecureBank</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>🏦 SecureBank</h2>

        <ul>

            <li>
                <a href="/dashboard">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="/deposit">
                    Deposit
                </a>
            </li>

            <li>
                <a href="#">
                    Withdraw
                </a>
            </li>

            <li>
                <a href="#">
                    Transfer
                </a>
            </li>

            <li>
                <a href="#">
                    Transactions
                </a>
            </li>

            <li>
                <a href="/logout">
                    Logout
                </a>
            </li>

        </ul>

    </div>


    <!-- Main Content -->

    <div class="main-content">

        <div class="welcome-card">

            <h1>Deposit Money</h1>

            <p>
                Add money securely to your bank account.
            </p>

        </div>


        <!-- Deposit Form -->

        <div class="form-card">

            <h2>Make a Deposit</h2>

            <p class="subtitle">
                Current Balance:
                ₹ {{ user.balance }}
            </p>


            <form method="POST">

                <div class="input-group">

                    <label for="amount">
                        Deposit Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="1"
                        placeholder="Enter amount"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Deposit Money
                </button>

            </form>


            <p class="login-link">

                <a href="/dashboard">
                    ← Back to Dashboard
                </a>

            </p>

        </div>

    </div>

</div>

</body>

</html>
