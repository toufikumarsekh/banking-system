<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SecureBank</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">


<div class="auth-container">


    <!-- Left Side -->

    <div class="auth-left">

        <div class="auth-brand">
            🏦 SecureBank
        </div>


        <h1>
            Welcome
            <span>back.</span>
        </h1>


        <p>
            Access your SecureBank account and
            manage your money securely from
            anywhere.
        </p>


        <div class="auth-features">

            <div>
                ✓ Secure Login
            </div>

            <div>
                ✓ Protected Account
            </div>

            <div>
                ✓ Easy Banking Access
            </div>

            <div>
                ✓ Available Anytime
            </div>

        </div>

    </div>



    <!-- Right Side -->

    <div class="auth-right">

        <div class="auth-card">


            <div class="auth-card-header">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Login to your SecureBank account
                </p>

            </div>



            <form method="POST">


                <div class="auth-input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="auth-input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>


            </form>



            <p class="auth-bottom-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>


        </div>

    </div>

</div>


</body>

</html>
